# Helfi.Space – docker-compose.yml
#
# This file usually stays the same across updates. Settings belong in .env,
# everything else (AD, SSO, email) is configured in the web interface.
#
#   Install:      copy env.example to .env, adjust it, then  docker compose up -d
#   Update:       Dockhand/Watchtower – or  ./update.sh  (remove leftovers: ./update.sh --cleanup)
#   First setup:  the setup code is in the log:  docker compose logs helfi

services:
  helfi:
    image: ghcr.io/soleil0815/helfi.space.ticket:${HELFI_VERSION:-latest}
    container_name: helfi
    restart: unless-stopped
    env_file: .env
    environment:
      # Version of this file – do not change. Helfi.Space shows a notice when it is outdated.
      HELFI_COMPOSE_VERSION: "1"
    ports:
      - "${HELFI_HTTP_PORT:-8080}:8080"
    volumes:
      # Database, attachments, backups, key file
      - ./data:/data
    labels:
      # Allow automatic updates via Watchtower (Dockhand detects new images by itself)
      - com.centurylinklabs.watchtower.enable=true
    stop_grace_period: 15s
    # Hardening: program files read-only, no extra privileges
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # only to set the permissions of ./data at startup and to switch to PUID/PGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
