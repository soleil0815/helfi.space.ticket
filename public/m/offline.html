<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>Helfi.Space – Keine Verbindung</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/m/m.css">
  <script type="module" src="/m/js/offline.js"></script>
</head>
<body class="m m-offline-page">
  <main class="m-offline" role="main">
    <img class="m-offline-logo" src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1 class="m-offline-title" data-t="m.offline.title">Keine Verbindung</h1>
    <p class="m-offline-text" data-t="m.offline.text">Helfi.Space ist gerade nicht erreichbar. Prüfe die WLAN- oder Mobilfunkverbindung (und ggf. das VPN) und versuche es erneut.</p>
    <button class="m-btn m-btn-primary m-offline-retry" type="button" data-t="m.retry">Erneut versuchen</button>
    <p class="m-offline-note" data-t="m.offline.note">Ticketdaten werden aus Datenschutzgründen nicht auf dem Gerät gespeichert.</p>
  </main>
</body>
</html>
