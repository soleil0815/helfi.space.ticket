# Tests, Image prüfen und (nur von main) veröffentlichen.
# - Pull Requests und main: Tests, AD-Integrationstest, Image bauen, Rauchtest (gehärtet), Schwachstellenprüfung
# - Release per Knopf: Actions → CI → Run workflow (Branch main) → Release: patch/minor/major.
#   Die Version zählt sich selbst hoch (höchster Tag + 1), Tag und GitHub-Release legt die CI an.
#   Das ist der EINZIGE Weg zu einem Release – ein von Hand gepushter Tag startet nichts.
# - Ablauf: Image für amd64/arm64 nativ bauen (ohne QEMU), je Architektur testen, als Kandidat
#   (eindeutig je Lauf) zusammenführen, GENAU DIESEN Digest auf Schwachstellen prüfen, erst dann als
#   1.2.3 (+ latest, wenn höchste Version) freigeben, Herkunftsnachweis (Build-Provenance) anhängen,
#   GitHub-Release mit Offline-Images und Prüfsummen. Veröffentlicht wird im Environment „release“
#   (nur Branch main). Es läuft immer nur ein Release zur selben Zeit.
# Actions sind auf Commit-SHAs festgelegt (Dependabot hält sie aktuell).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Neue Version veröffentlichen? (nur auf main)'
        type: choice
        options: [nein, patch, minor, major]
        default: nein

permissions:
  contents: read

# Releases nie gleichzeitig (zweiter Knopfdruck wartet); andere Läufe je Branch/PR
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Werkzeuge für Shell-Tests
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck dash >/dev/null
      - name: Tests (inkl. update.sh mit dash, entrypoint.sh als root)
        run: npm test && sudo -E env "PATH=$PATH" node --test test/entrypoint.test.js
      - name: Abhängigkeiten auf bekannte Lücken prüfen
        run: npm audit --omit=dev --audit-level=high
      - name: Shell-Skripte prüfen
        run: |
          shellcheck -s sh update.sh docker/entrypoint.sh scripts/*.sh .github/scripts/*.sh
          dash -n update.sh && dash -n docker/entrypoint.sh

  ad-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Samba AD installieren und starten
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends samba samba-ad-dc samba-ad-provision winbind >/dev/null
          sudo systemctl stop samba-ad-dc smbd nmbd winbind 2>/dev/null || true
          sudo sh scripts/test-samba-ad.sh
      - name: Integrationstest LDAPS/StartTLS/Gruppen
        run: npm run test:integration
        env:
          HELFI_TEST_LDAP_HOST: dc01.firma.local

  # Image bauen und prüfen (ohne Schreibrechte, ohne Veröffentlichung)
  image:
    needs: [test, ad-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image bauen (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: helfi-test:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          # Cache nur von main schreiben (PRs können ihn nicht vergiften)
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Rauchtest (gehärtet wie in docker-compose.yml)
        run: sh .github/scripts/smoke-test.sh helfi-test:ci
      - name: Schwachstellenprüfung
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: helfi-test:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Schwachstellen auswerten
        run: sh .github/scripts/trivy-check.sh trivy.json

  # Veröffentlichen: nur per Knopf, nur vom aktuellen Stand von main, nur nach erfolgreichen Prüfungen.
  release-check:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release != 'nein' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Herkunft prüfen und Version bestimmen
        id: v
        env:
          MODE: ${{ inputs.release }}
        run: |
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "::error::Release nur per Knopf ($GITHUB_EVENT_NAME)"; exit 1; }
          # nur vom Branch main und nur dessen aktueller Stand
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Release per Knopf nur vom Branch main ($GITHUB_REF)"; exit 1; }
          [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ] || { echo "::error::$GITHUB_SHA ist nicht der aktuelle Stand von main"; exit 1; }
          case "$MODE" in patch|minor|major) ;; *) echo "::error::Unbekannte Release-Art ($MODE)"; exit 1 ;; esac
          out="$(sh .github/scripts/next-version.sh "$MODE")" || { echo "::error::Version nicht bestimmbar ($MODE)"; exit 1; }
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  # Jede Architektur nativ bauen und auf ihrer eigenen Hardware testen.
  # Kein QEMU: Node bricht unter Emulation mit „Illegal instruction“ (Exit 132) ab.
  release-build:
    needs: [release-check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version ins Image übernehmen
        env:
          V: ${{ needs.release-check.outputs.version }}
        run: |
          sed -i "s/^  \"version\": \"[^\"]*\"/  \"version\": \"$V\"/" package.json
          grep -q "^  \"version\": \"$V\"," package.json || { echo "::error::Version nicht gesetzt"; exit 1; }
      - name: Kandidat bauen und pushen (${{ matrix.arch }}, ohne Cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          no-cache: true
          provenance: false
          build-args: VERSION=${{ needs.release-check.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ needs.release-check.outputs.version }}-kandidat-${{ github.run_id }}-${{ matrix.arch }}
      - name: Kandidat testen (${{ matrix.arch }})
        run: |
          img="$IMAGE:${{ needs.release-check.outputs.version }}-kandidat-${{ github.run_id }}-${{ matrix.arch }}"
          docker pull "$img"
          sh .github/scripts/smoke-test.sh "$img"

  publish:
    needs: [release-check, release-build]
    runs-on: ubuntu-24.04
    # Environment „release“: nur vom Branch main zulässig (Einstellung im Repository)
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write      # Herkunftsnachweis signieren
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version übernehmen
        id: v
        run: |
          echo "version=${{ needs.release-check.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ needs.release-check.outputs.latest }}" >> "$GITHUB_OUTPUT"
      - name: Tag darf noch nicht existieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.v.outputs.version }} gibt es schon (zwei Releases gleichzeitig?)"; exit 1
          fi
      - name: Kandidat aus beiden Architekturen zusammenführen (Digest festhalten)
        id: cand
        run: |
          k="$IMAGE:${{ steps.v.outputs.version }}-kandidat-$GITHUB_RUN_ID"
          docker buildx imagetools create -t "$k" "$k-amd64" "$k-arm64"
          digest="$(docker buildx imagetools inspect "$k" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in sha256:*) ;; *) echo "::error::Digest des Kandidaten nicht lesbar ($digest)"; exit 1 ;; esac
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Kandidat auf Schwachstellen prüfen (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.cand.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-amd64.json
          exit-code: '0'
      - run: sh .github/scripts/trivy-check.sh trivy-amd64.json
      - name: Kandidat auf Schwachstellen prüfen (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.cand.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-arm64.json
          exit-code: '0'
      - run: sh .github/scripts/trivy-check.sh trivy-arm64.json
      - name: Geprüftes Image freigeben (gleicher Digest)
        env:
          DIGEST: ${{ steps.cand.outputs.digest }}
        run: |
          v="${{ steps.v.outputs.version }}"
          tags="-t $IMAGE:$v"
          [ "${{ steps.v.outputs.latest }}" = true ] && tags="$tags -t $IMAGE:latest"
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$IMAGE@$DIGEST"
          now="$(docker buildx imagetools inspect "$IMAGE:$v" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$now" = "$DIGEST" ] || { echo "::error::Freigegebenes Image ($now) ist nicht der geprüfte Kandidat ($DIGEST)"; exit 1; }
      - name: Herkunftsnachweis (Build-Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.cand.outputs.digest }}
          push-to-registry: true
      - name: Release-Dateien (Offline-Images + Prüfsummen)
        env:
          DIGEST: ${{ steps.cand.outputs.digest }}
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p release
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            docker tag "$IMAGE@$DIGEST" "$IMAGE:$v"
            # Sicherstellen, dass wirklich die gewünschte Architektur gespeichert wird
            got="$(docker image inspect --format '{{.Architecture}}' "$IMAGE:$v")"
            [ "$got" = "$arch" ] || { echo "::error::Offline-Image $arch hat Architektur $got"; exit 1; }
            if docker save --help 2>/dev/null | grep -q -- '--platform'; then
              docker save --platform "linux/$arch" "$IMAGE:$v" | gzip > "release/helfi-$v-$arch.tar.gz"
            else
              docker save "$IMAGE:$v" | gzip > "release/helfi-$v-$arch.tar.gz"
            fi
            docker image rm "$IMAGE:$v" "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          done
          cp docker-compose.yml env.example update.sh release/
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: GitHub-Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.v.outputs.latest }}
          files: release/*
          generate_release_notes: true
