# Tests, image checks and (from main only) publishing.
# - Pull requests and main: tests, AD integration test, image build, smoke test (hardened), vulnerability scan
# - Release by button: Actions → CI → Run workflow (branch main) → Release: patch/minor/major.
#   The version increments itself (highest tag + 1); the CI creates the tag and the GitHub release.
#   This is the ONLY way to a release – a manually pushed tag triggers nothing.
# - Flow: build the image natively for amd64/arm64 (no QEMU), test per architecture, merge into a
#   candidate (unique per run), scan EXACTLY THIS digest for vulnerabilities, only then publish as
#   1.2.3 (+ latest if highest version), GitHub release with offline images and checksums.
#   (No provenance attestation via actions/attest-build-provenance: GitHub does not offer it for
#   private repositories of personal accounts.) Publishing happens in the environment "release"
#   (branch main only). Only one release runs at a time.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a new version? (main only; nein = no)'
        type: choice
        options: [nein, patch, minor, major]
        default: nein

permissions:
  contents: read

# Never run releases concurrently (a second button press waits); other runs per branch/PR
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # Browser tests (test/mobile*.test.js, people-picker, UI audit) need Playwright with Chromium.
      # It is not a dependency of the app: installed below at this exact version, outside the
      # project tree, and found by the tests via NODE_PATH. HELFI_REQUIRE_BROWSER makes the tests
      # fail instead of skipping when it is missing.
      PLAYWRIGHT_VERSION: '1.63.0'
      HELFI_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tools for shell tests
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck dash >/dev/null
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright with Chromium (pinned)
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -eu
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          pw="$RUNNER_TEMP/pw/node_modules/.bin/playwright"
          test "$("$pw" --version)" = "Version $PLAYWRIGHT_VERSION"
          # Browser from the cache: only the system libraries are missing on a fresh runner
          if [ "$CACHE_HIT" = "true" ]; then "$pw" install-deps chromium; else "$pw" install --with-deps chromium; fi
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Tests (incl. update.sh with dash, entrypoint.sh as root)
        run: npm test && sudo -E env "PATH=$PATH" node --test test/entrypoint.test.js
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Lint shell scripts
        run: |
          shellcheck -s sh update.sh docker/entrypoint.sh scripts/*.sh .github/scripts/*.sh
          dash -n update.sh && dash -n docker/entrypoint.sh

  ad-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install and start Samba AD
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends samba samba-ad-dc samba-ad-provision winbind >/dev/null
          sudo systemctl stop samba-ad-dc smbd nmbd winbind 2>/dev/null || true
          sudo sh scripts/test-samba-ad.sh
      - name: Integration test LDAPS/StartTLS/groups
        run: npm run test:integration
        env:
          HELFI_TEST_LDAP_HOST: dc01.firma.local

  # Build and check the image (no write permissions, no publishing)
  image:
    needs: [test, ad-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: helfi-test:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          # Write the cache from main only (PRs cannot poison it)
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Smoke test (hardened as in docker-compose.yml)
        run: sh .github/scripts/smoke-test.sh helfi-test:ci
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: helfi-test:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Evaluate vulnerabilities
        run: sh .github/scripts/trivy-check.sh trivy.json

  # Publishing: only by button, only from the current state of main, only after successful checks.
  release-check:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release != 'nein' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check origin and determine version
        id: v
        env:
          MODE: ${{ inputs.release }}
        run: |
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "::error::Release only by button ($GITHUB_EVENT_NAME)"; exit 1; }
          # only from branch main and only its current state
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Release by button only from branch main ($GITHUB_REF)"; exit 1; }
          [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ] || { echo "::error::$GITHUB_SHA is not the current state of main"; exit 1; }
          case "$MODE" in patch|minor|major) ;; *) echo "::error::Unknown release type ($MODE)"; exit 1 ;; esac
          out="$(sh .github/scripts/next-version.sh "$MODE")" || { echo "::error::Cannot determine version ($MODE)"; exit 1; }
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  # Build each architecture natively and test it on its own hardware.
  # No QEMU: Node aborts under emulation with "Illegal instruction" (exit 132).
  release-build:
    needs: [release-check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set version for the image
        env:
          V: ${{ needs.release-check.outputs.version }}
        run: |
          sed -i "s/^  \"version\": \"[^\"]*\"/  \"version\": \"$V\"/" package.json
          grep -q "^  \"version\": \"$V\"," package.json || { echo "::error::Version not set"; exit 1; }
      - name: Build and push candidate (${{ matrix.arch }}, no cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          no-cache: true
          provenance: false
          build-args: VERSION=${{ needs.release-check.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ needs.release-check.outputs.version }}-kandidat-${{ github.run_id }}-${{ matrix.arch }}
      - name: Test candidate (${{ matrix.arch }})
        run: |
          img="$IMAGE:${{ needs.release-check.outputs.version }}-kandidat-${{ github.run_id }}-${{ matrix.arch }}"
          docker pull "$img"
          sh .github/scripts/smoke-test.sh "$img"

  publish:
    needs: [release-check, release-build]
    runs-on: ubuntu-24.04
    # Environment "release": only allowed from branch main (repository setting)
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set version outputs
        id: v
        run: |
          echo "version=${{ needs.release-check.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ needs.release-check.outputs.latest }}" >> "$GITHUB_OUTPUT"
      - name: Tag must not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.v.outputs.version }} already exists (two releases at once?)"; exit 1
          fi
      - name: Merge candidate from both architectures (record digest)
        id: cand
        run: |
          k="$IMAGE:${{ steps.v.outputs.version }}-kandidat-$GITHUB_RUN_ID"
          docker buildx imagetools create -t "$k" "$k-amd64" "$k-arm64"
          digest="$(docker buildx imagetools inspect "$k" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in sha256:*) ;; *) echo "::error::Cannot read the candidate digest ($digest)"; exit 1 ;; esac
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan candidate for vulnerabilities (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.cand.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-amd64.json
          exit-code: '0'
      - run: sh .github/scripts/trivy-check.sh trivy-amd64.json
      - name: Scan candidate for vulnerabilities (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.cand.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-arm64.json
          exit-code: '0'
      - run: sh .github/scripts/trivy-check.sh trivy-arm64.json
      - name: Release files (offline images + checksums)
        env:
          DIGEST: ${{ steps.cand.outputs.digest }}
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p release
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            docker tag "$IMAGE@$DIGEST" "$IMAGE:$v"
            # Make sure the requested architecture is really saved
            got="$(docker image inspect --format '{{.Architecture}}' "$IMAGE:$v")"
            [ "$got" = "$arch" ] || { echo "::error::Offline image $arch has architecture $got"; exit 1; }
            if docker save --help 2>/dev/null | grep -q -- '--platform'; then
              docker save --platform "linux/$arch" "$IMAGE:$v" | gzip > "release/helfi-$v-$arch.tar.gz"
            else
              docker save "$IMAGE:$v" | gzip > "release/helfi-$v-$arch.tar.gz"
            fi
            docker image rm "$IMAGE:$v" "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          done
          cp docker-compose.yml env.example update.sh release/
          (cd release && sha256sum -- * > SHA256SUMS)
      # Publish only at the very end: if anything fails before, no half release is left in the registry
      - name: Publish the checked image (same digest)
        env:
          DIGEST: ${{ steps.cand.outputs.digest }}
        run: |
          v="${{ steps.v.outputs.version }}"
          tags="-t $IMAGE:$v"
          [ "${{ steps.v.outputs.latest }}" = true ] && tags="$tags -t $IMAGE:latest"
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$IMAGE@$DIGEST"
          now="$(docker buildx imagetools inspect "$IMAGE:$v" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$now" = "$DIGEST" ] || { echo "::error::Published image ($now) is not the checked candidate ($DIGEST)"; exit 1; }
      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.v.outputs.latest }}
          files: release/*
          generate_release_notes: true
