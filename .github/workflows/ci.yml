# Tests, Image prüfen und (nur von main) veröffentlichen.
# - Pull Requests und main: Tests, AD-Integrationstest, Image bauen, Rauchtest (gehärtet), Schwachstellenprüfung
# - Release per Knopf: Actions → CI → Run workflow (Branch main) → Release: patch/minor/major.
#   Die Version zählt sich selbst hoch (höchster Tag + 1), Tag und GitHub-Release legt die CI an.
#   Alternativ startet ein von Hand gesetzter Tag v1.2.3 auf main denselben Ablauf.
# - Ablauf: Image für amd64/arm64 nativ bauen (ohne QEMU), je Architektur testen, als Kandidat
#   zusammenführen, GENAU DIESES Image auf Schwachstellen prüfen, erst dann als 1.2.3
#   (+ latest, wenn höchste Version) freigeben, GitHub-Release mit Offline-Images und Prüfsummen.
# Actions sind auf Commit-SHAs festgelegt (Dependabot hält sie aktuell).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Neue Version veröffentlichen? (nur auf main)'
        type: choice
        options: [nein, patch, minor, major]
        default: nein

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Werkzeuge für Shell-Tests
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck dash >/dev/null
      - name: Tests (inkl. update.sh mit dash, entrypoint.sh als root)
        run: npm test && sudo -E env "PATH=$PATH" node --test test/entrypoint.test.js
      - name: Abhängigkeiten auf bekannte Lücken prüfen
        run: npm audit --omit=dev --audit-level=high
      - name: Shell-Skripte prüfen
        run: |
          shellcheck -s sh update.sh docker/entrypoint.sh scripts/*.sh .github/scripts/*.sh
          dash -n update.sh && dash -n docker/entrypoint.sh

  ad-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Samba AD installieren und starten
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends samba samba-ad-dc samba-ad-provision winbind >/dev/null
          sudo systemctl stop samba-ad-dc smbd nmbd winbind 2>/dev/null || true
          sudo sh scripts/test-samba-ad.sh
      - name: Integrationstest LDAPS/StartTLS/Gruppen
        run: npm run test:integration
        env:
          HELFI_TEST_LDAP_HOST: dc01.firma.local

  # Image bauen und prüfen (ohne Schreibrechte, ohne Veröffentlichung)
  image:
    needs: [test, ad-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image bauen (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: helfi-test:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          # Cache nur von main schreiben (PRs können ihn nicht vergiften)
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Rauchtest (gehärtet wie in docker-compose.yml)
        run: sh .github/scripts/smoke-test.sh helfi-test:ci
      - name: Schwachstellenprüfung
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: helfi-test:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Schwachstellen auswerten
        run: sh .github/scripts/trivy-check.sh trivy.json

  # Veröffentlichen: nur Tags, nur von main, nur nach erfolgreichen Prüfungen
  release-check:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release != 'nein' && github.ref == 'refs/heads/main')
    needs: [image]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Herkunft prüfen und Version bestimmen
        id: v
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || format('tag:{0}', github.ref_name) }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Commit liegt nicht auf main"; exit 1; }
          out="$(sh .github/scripts/next-version.sh "$MODE")" || { echo "::error::Version nicht bestimmbar ($MODE)"; exit 1; }
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  # Jede Architektur nativ bauen und auf ihrer eigenen Hardware testen.
  # Kein QEMU: Node bricht unter Emulation mit „Illegal instruction“ (Exit 132) ab.
  release-build:
    needs: [release-check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version ins Image übernehmen
        env:
          V: ${{ needs.release-check.outputs.version }}
        run: |
          sed -i "s/^  \"version\": \"[^\"]*\"/  \"version\": \"$V\"/" package.json
          grep -q "^  \"version\": \"$V\"," package.json || { echo "::error::Version nicht gesetzt"; exit 1; }
      - name: Kandidat bauen und pushen (${{ matrix.arch }}, ohne Cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          no-cache: true
          provenance: false
          build-args: VERSION=${{ needs.release-check.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ needs.release-check.outputs.version }}-kandidat-${{ matrix.arch }}
      - name: Kandidat testen (${{ matrix.arch }})
        run: |
          img="$IMAGE:${{ needs.release-check.outputs.version }}-kandidat-${{ matrix.arch }}"
          docker pull "$img"
          sh .github/scripts/smoke-test.sh "$img"

  publish:
    needs: [release-check, release-build]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version übernehmen
        id: v
        run: |
          echo "version=${{ needs.release-check.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ needs.release-check.outputs.latest }}" >> "$GITHUB_OUTPUT"
      - name: Tag darf noch nicht existieren (Release per Knopf)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.v.outputs.version }} gibt es schon (zwei Releases gleichzeitig?)"; exit 1
          fi
      - name: Kandidat aus beiden Architekturen zusammenführen
        run: |
          v="${{ steps.v.outputs.version }}"
          docker buildx imagetools create -t "$IMAGE:$v-kandidat" "$IMAGE:$v-kandidat-amd64" "$IMAGE:$v-kandidat-arm64"
          docker buildx imagetools inspect "$IMAGE:$v-kandidat"
      - name: Kandidat auf Schwachstellen prüfen (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-kandidat
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-amd64.json
          exit-code: '0'
      - run: sh .github/scripts/trivy-check.sh trivy-amd64.json
      - name: Kandidat auf Schwachstellen prüfen (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-kandidat
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-arm64.json
          exit-code: '0'
      - run: sh .github/scripts/trivy-check.sh trivy-arm64.json
      - name: Geprüftes Image freigeben (gleicher Digest)
        run: |
          v="${{ steps.v.outputs.version }}"
          tags="-t $IMAGE:$v"
          [ "${{ steps.v.outputs.latest }}" = true ] && tags="$tags -t $IMAGE:latest"
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$IMAGE:$v-kandidat"
      - name: Release-Dateien (Offline-Images + Prüfsummen)
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p release
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$v"
            docker save "$IMAGE:$v" | gzip > "release/helfi-$v-$arch.tar.gz"
          done
          cp docker-compose.yml .env.example update.sh release/
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: GitHub-Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.v.outputs.latest }}
          files: release/*
          generate_release_notes: true
